name: Deploy ingest Worker

# Deploys the community-submissions ingest Worker (skulk-open-ledger Phase 2):
# applies the idempotent D1 schema, pushes Worker secrets from repo secrets,
# and deploys. Runs on ingest changes on main and on manual dispatch.
on:
  push:
    branches: [main]
    paths: ['ingest/**', 'src/data/submission-gates.ts', '.github/workflows/ingest-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply D1 schema
        working-directory: ingest
        run: npx --yes wrangler@3 d1 execute skulk-ledger --remote --file=schema.sql
      - name: Push Worker secrets
        working-directory: ingest
        env:
          ADMIN_TOKEN: ${{ secrets.INGEST_ADMIN_TOKEN }}
          BAKE_TOKEN: ${{ secrets.INGEST_BAKE_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@3 secret put ADMIN_TOKEN
          printf '%s' "$BAKE_TOKEN" | npx --yes wrangler@3 secret put BAKE_TOKEN
      - name: Deploy Worker
        working-directory: ingest
        run: npx --yes wrangler@3 deploy | tee deploy.log; grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1
