name: Deploy ledger to GitHub Pages

# NOTE: the name above is historical; since 2026-07-10 this workflow deploys
# to CLOUDFLARE PAGES at https://benchmarks.foxlight.ai (Phase 0 of the
# skulk-open-ledger initiative). The filename stays `deploy.yml` because the
# harness's post-battery publish step dispatches it by filename
# (`gh workflow run deploy.yml`).
#
# Builds the static ledger from the durable results store and publishes it to
# Cloudflare Pages by direct upload. Runs on push to main, on manual/harness
# dispatch, and on a schedule so newly published runs surface without a code
# change.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild a few times a day to pick up runs published to the data store.
  schedule:
    - cron: '0 */6 * * *'

env:
  # Root base: the site serves from / on the custom domain (and pages.dev).
  DEPLOY_BASE: /
  # Cloudflare account ids are not secrets (they appear in dashboard URLs);
  # the API token is the credential and stays in the repo secret.
  CLOUDFLARE_ACCOUNT_ID: 361eb1ded0b0af91e8fb35d02d8e3c34
  PAGES_PROJECT: skulk-benchmarks

permissions:
  contents: read

# Never run two deploys at once; let a newer one supersede an in-flight one.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Surface the secret as an env var so it can be tested in a step `if`.
      # A fine-grained PAT with read access to skulk-results-data.
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      # The private results store; without it the deploy is gated off so an
      # empty ledger never publishes.
      - name: Checkout results store
        id: store
        if: ${{ env.DATA_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: Foxlight-Foundation/skulk-results-data
          token: ${{ env.DATA_REPO_TOKEN }}
          path: results-data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generate the public data from the store, redacting operator-identifying
      # fields. --runs points at the store's flat reports/ layout; a missing
      # directory yields an empty index, not an error.
      # Approved community submissions from the ingest Worker. Best-effort: an
      # unreachable ingest never blocks the first-party bake (empty dir = no
      # community tier this build).
      - name: Fetch approved community submissions
        if: ${{ steps.store.outcome == 'success' }}
        env:
          BAKE_TOKEN: ${{ secrets.INGEST_BAKE_TOKEN }}
        run: |
          set -u
          mkdir -p community-data/reports
          echo '{}' > community-data/manifest.json
          if [ -n "$BAKE_TOKEN" ]; then
            # Page on the submitted_at cursor until a short page: a single
            # capped fetch would silently drop approvals beyond the first 500.
            node -e '
              const fs = require("fs");
              (async () => {
                const manifest = {};
                let since = "1970-01-01T00:00:00Z";
                for (;;) {
                  const resp = await fetch(
                    "https://skulk-ledger-ingest.thomastupper92618.workers.dev/v1/bake-export?since=" + encodeURIComponent(since),
                    { headers: { authorization: "Bearer " + process.env.BAKE_TOKEN } },
                  );
                  if (!resp.ok) throw new Error("bake-export HTTP " + resp.status);
                  const data = await resp.json();
                  const batch = data.submissions ?? [];
                  for (const s of batch) {
                    fs.writeFileSync("community-data/reports/" + s.runId + ".json", JSON.stringify(s.report));
                    manifest[s.runId] = { submitter: s.submitter };
                    if (s.submittedAt > since) since = s.submittedAt;
                  }
                  if (batch.length < 500) break;
                }
                fs.writeFileSync("community-data/manifest.json", JSON.stringify(manifest));
                console.log("community submissions: " + Object.keys(manifest).length);
              })().catch((e) => {
                // All-or-nothing: a partial page set with an empty manifest
                // would import reports with wrong attribution.
                fs.rmSync("community-data/reports", { recursive: true, force: true });
                fs.mkdirSync("community-data/reports", { recursive: true });
                fs.writeFileSync("community-data/manifest.json", "{}");
                console.log("ingest fetch failed (" + e.message + "); building without community tier");
              });
            '
          else
            echo "bake token unset; building without community tier"
          fi

      - name: Import + redact
        run: npm run import -- --runs results-data/reports --community community-data --redact

      - name: Build
        run: npm run build

      # Cloudflare Pages serves index.html with a 200 for unmatched paths
      # (native SPA fallback) only when no 404.html exists; the postbuild
      # 404.html copy is a GitHub-Pages-ism, so drop it here.
      - name: Use native SPA fallback
        run: rm -f dist/404.html

      # Recreate the Pages project if it ever disappears; normally a no-op.
      - name: Ensure Pages project exists
        if: ${{ steps.store.outcome == 'success' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")
          if [ "$status" = "404" ]; then
            echo "creating Pages project $PAGES_PROJECT"
            curl -sf -X POST \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$PAGES_PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              | jq '{success, errors}'
          else
            echo "Pages project $PAGES_PROJECT present (HTTP $status)"
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ steps.store.outcome == 'success' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 361eb1ded0b0af91e8fb35d02d8e3c34
          command: pages deploy dist --project-name=skulk-benchmarks --branch=main
