# One-shot maintenance for the ingest plane. Currently: delete smoke-test
# rows created by the Phase 2 end-to-end validation. Removed before merge.
name: Ingest provision
on:
  workflow_dispatch:
  push:
    branches: [feat/ingest-plane]
    paths: ['.github/workflows/ingest-provision.yml']

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 361eb1ded0b0af91e8fb35d02d8e3c34
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete smoke-test submissions
        run: |
          npx --yes wrangler@3 d1 execute skulk-ledger --remote \
            --command "DELETE FROM submissions WHERE run_id LIKE '%smoke-test%'; SELECT COUNT(*) AS remaining FROM submissions;"
